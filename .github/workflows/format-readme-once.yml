name: Format README once

on:
  push:
    branches:
      - feat/autopilot-mvp
    paths:
      - '.github/workflows/format-readme-once.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/autopilot-mvp

      - uses: actions/setup-node@v7
        with:
          node-version: 22.x

      - name: Install exact dependencies
        run: |
          npm install --global npm@11.6.0
          npm ci --no-audit --no-fund

      - name: Format README with pinned Prettier
        run: npx prettier --write README.md

      - name: Commit formatted README if needed
        run: |
          if git diff --quiet -- README.md; then
            echo 'README already formatted.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git commit -m 'style: format README'
          git push origin HEAD:feat/autopilot-mvp
