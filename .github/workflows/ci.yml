name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22.x'
      - name: Use npm 11.6.0
        run: npm install --global npm@11.6.0 && npm --version
      - name: Install exact dependencies
        run: npm ci --no-audit --no-fund
      - name: Format check
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit and integration tests
        run: npm test -- --run
      - name: Build standalone userscript
        run: npm run build
      - name: Metadata check
        run: npm run check:metadata
      - name: Privacy scan
        run: npm run check:privacy
      - name: Upload verified userscript
        uses: actions/upload-artifact@v4
        with:
          name: chatgpt-autopilot-userscript
          path: dist/chatgpt-autopilot.user.js
          if-no-files-found: error
