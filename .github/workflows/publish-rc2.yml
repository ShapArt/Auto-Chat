name: Publish RC2 userscript

on:
  push:
    branches:
      - rc/v0.1.0-rc2
    paths:
      - .github/workflows/publish-rc2.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: rc/v0.1.0-rc2
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
      - name: Use pinned npm
        run: npm install --global npm@11.6.0
      - name: Install exact dependencies
        run: npm ci --no-audit --no-fund
      - name: Build userscript
        run: npm run build
      - name: Verify exact RC2 hash
        run: echo '948188405dc5671a9dfb151943afd7760fade394f2fea77846da16bfa79d046f  dist/chatgpt-autopilot.user.js' | sha256sum --check --strict
      - name: Publish root userscript
        run: |
          cp dist/chatgpt-autopilot.user.js chatgpt-autopilot.user.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add chatgpt-autopilot.user.js
          git commit -m 'build: publish verified v0.1.0-rc2 userscript'
          git push origin HEAD:rc/v0.1.0-rc2
