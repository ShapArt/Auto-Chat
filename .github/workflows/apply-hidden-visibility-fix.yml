name: Apply hidden ancestor visibility fix

on:
  push:
    branches:
      - feat/autopilot-mvp

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/autopilot-mvp
      - uses: actions/setup-node@v7
        with:
          node-version: '22.x'
      - name: Apply targeted visibility fix
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path('src/main.ts'): (
                  """function visible(element: HTMLElement): boolean {\n  if (element.hidden || element.getAttribute('aria-hidden') === 'true') return false;\n  const view = element.ownerDocument.defaultView;\n  const style = view?.getComputedStyle(element);\n  return !style || (style.display !== 'none' && style.visibility !== 'hidden');\n}\n""",
                  """function visible(element: HTMLElement): boolean {\n  const view = element.ownerDocument.defaultView;\n  let current: HTMLElement | null = element;\n\n  while (current) {\n    if (current.hidden || current.getAttribute('aria-hidden') === 'true') return false;\n    const style = view?.getComputedStyle(current);\n    if (style && (style.display === 'none' || style.visibility === 'hidden')) return false;\n    current = current.parentElement;\n  }\n\n  return true;\n}\n""",
              ),
              Path('src/chatgpt/dom-adapter.ts'): (
                  """  private isVisible(element: HTMLElement): boolean {\n    if (element.hidden || element.getAttribute('aria-hidden') === 'true') return false;\n    const style = this.doc.defaultView?.getComputedStyle(element);\n    if (!style) return true;\n    return style.display !== 'none' && style.visibility !== 'hidden';\n  }\n""",
                  """  private isVisible(element: HTMLElement): boolean {\n    const view = this.doc.defaultView;\n    let current: HTMLElement | null = element;\n\n    while (current) {\n      if (current.hidden || current.getAttribute('aria-hidden') === 'true') return false;\n      const style = view?.getComputedStyle(current);\n      if (style && (style.display === 'none' || style.visibility === 'hidden')) return false;\n      current = current.parentElement;\n    }\n\n    return true;\n  }\n""",
              ),
          }

          for path, (old, new) in replacements.items():
              text = path.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f'expected exactly one target in {path}, found {text.count(old)}')
              path.write_text(text.replace(old, new))
          PY
      - name: Use npm 11.6.0
        run: npm install --global npm@11.6.0
      - name: Install exact dependencies
        run: npm ci --no-audit --no-fund
      - name: Format changed source files
        run: npx prettier --write src/main.ts src/chatgpt/dom-adapter.ts
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.ts src/chatgpt/dom-adapter.ts
          git commit -m "fix: ignore UI hidden by ancestor containers"
          git push origin HEAD:feat/autopilot-mvp
