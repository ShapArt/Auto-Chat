name: Format feature branch

on:
  push:
    branches:
      - feat/autopilot-mvp

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/autopilot-mvp
      - uses: actions/setup-node@v7
        with:
          node-version: '22.x'
      - name: Use npm 11.6.0
        run: npm install --global npm@11.6.0
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Format maintained code
        run: npx prettier --write "scripts/**/*.mjs" "src/**/*.ts" "tests/**/*.test.ts" README.md
      - name: Commit formatting if needed
        run: |
          if git diff --quiet; then
            echo "Formatting already clean."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts src tests README.md
          git commit -m "style: apply prettier formatting"
          git push origin HEAD:feat/autopilot-mvp
